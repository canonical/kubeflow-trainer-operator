apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: torch-distributed
  labels:
    trainer.kubeflow.org/framework: torch
spec:
  mlPolicy:
    numNodes: 1
    torch:
      numProcPerNode: auto
  template:
    spec:
      replicatedJobs:
      - name: node
        template:
          metadata:
            labels:
              trainer.kubeflow.org/trainjob-ancestor-step: trainer
          spec:
            template:
              metadata:
                labels:
                  sidecar.istio.io/inject: 'false'
                  # Opt out of Istio ambient mesh to enable pod-to-pod communication for distributed training.
                  istio.io/dataplane-mode: none
              spec:
                containers:
                - image: docker.io/charmedkubeflow/pytorch:2.7.1-cuda12.8-cudnn9-runtime-fcb3fb8-20261113161734
                  name: node
                  # Customization: workingDir must be set because the rock defines no WORKDIR, so it would default to `/`.
                  # It must exist in the rock and be writable by its non-root user (see the `non-root-user` part in the rock's rockcraft.yaml).
                  workingDir: /workspace
