apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: deepspeed-simple
spec:
  runtimeRef:
    name: deepspeed-distributed
  trainer:
    numNodes: 2
    # Overrides only the launcher's command; the rock's default entrypoint never exits, so `test_create_training_jobs` fails.
    command: ["mpirun", "--hostfile", "/etc/mpi/hostfile", "python", "-c", "import deepspeed; print(deepspeed.__version__)"]
